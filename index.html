:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn{margin-top:1.6rem;padding:.5rem 1.6rem;font-size:1.4rem;border:2px solid var(--accent);border-radius:999px;background:transparent;color:var(--ink);transition:background .2s,color .2s}
.btn:hover{background:var(--accent);color:var(--bg1)}
.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-20px;border-radius:50%;background:var(--pink);opacity:.7;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--sx),108vh)}}
h1.script{font-size:clamp(2.6rem,12vw,4.4rem);color:var(--accent)}
/* gift + cat */
#gift-s{justify-content:flex-start;padding-top:9vh}
#catwrap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;animation:rise 1.8s cubic-bezier(.2,.8,.2,1)}
#catwrap.leave{transition:transform 1s ease-in;transform:translateY(115%)}
@keyframes rise{from{transform:translateY(105%)}}
#giftbtn{background:none;border:0;padding:0;line-height:0}
#giftbtn svg{width:min(78vw,320px);height:auto}
#giftbtn svg *{transform-box:fill-box;transform-origin:center}
.eyes ellipse{animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#bx{animation:give 1s 1.6s ease-out both}
@keyframes give{50%{transform:translateY(-10px)}to{transform:translateY(-4px)}}
#giftbtn:not(.open) #bow{transform-origin:50% 100%;animation:wig 2.2s ease-in-out infinite}
@keyframes wig{50%{transform:rotate(-4deg)}}
#bow *,#lid{transition:transform .8s ease-in,opacity .8s ease-in}
#giftbtn.open .lp{transform:translate(-30px,-34px) rotate(-55deg) scale(.3);opacity:0}
#giftbtn.open .rp{transform:translate(30px,-34px) rotate(55deg) scale(.3);opacity:0}
#giftbtn.open .tl{transform:translate(-14px,70px) rotate(-40deg);opacity:0}
#giftbtn.open .tr{transform:translate(14px,70px) rotate(40deg);opacity:0}
#giftbtn.open .kn{transform:scale(0);opacity:0}
#giftbtn.open #lid{transform:translateY(-60px) rotate(-10deg);opacity:0;transition-delay:.4s}
#pw{margin:0}
#pw[hidden]{display:none}
#pw label{display:block;font-size:1.5rem;color:var(--soft)}
#pin{margin-top:.5rem;width:11ch;text-align:center;font:inherit;font-size:1.8rem;letter-spacing:.3em;padding:.3rem .6rem;border:2px solid var(--pink);border-radius:12px;background:var(--paper);color:#4a3b3f}
#pw .btn{margin-top:.8rem}
#pmsg{min-height:1.5rem;margin:.4rem 0 0;font-size:1.2rem;color:var(--accent)}
.shake{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* bloom */
#bloom{padding:0;z-index:3}
#cv{position:absolute;inset:0;width:100%;height:100%}
/* photos */
#photos{justify-content:center}
.ph{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:4/5;border:0;background:#f8e6ec center/cover no-repeat;color:#b07a8c;font-size:1.3rem;outline-offset:-3px}
/* parchment letter */
.later{opacity:0;pointer-events:none;transition:opacity .6s}
.later.show{opacity:1;pointer-events:auto}
#end p{max-width:30ch;font-size:1.65rem;line-height:1.4;margin:1rem 0 0}
.from{color:var(--soft)}
.link{margin-top:1.4rem;background:none;border:0;color:var(--soft);font-size:1.2rem;text-decoration:underline}
/* running cat */
#rcat{position:fixed;left:0;top:0;z-index:6;pointer-events:none;will-change:transform}
#rcat[hidden]{display:none}
#rcat svg{display:block;width:104px;height:auto}
#rcat .cg,#rcat .legs rect,#rcat .tail{transform-box:fill-box}
#rcat .legs rect{transform-origin:50% 0}
.running .l1,.running .l4{animation:step .22s infinite alternate}
.running .l2,.running .l3{animation:step .22s infinite alternate-reverse}
@keyframes step{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
#rcat .tail{transform-origin:100% 100%;animation:wag .5s infinite alternate}
@keyframes wag{to{transform:rotate(14deg)}}
.cuddle .legs{opacity:0}
.cuddle .cg{transform-origin:50% 100%;animation:br 1.6s infinite alternate}
@keyframes br{from{transform:scaleY(.8)}to{transform:scaleY(.86)}}
.heart{position:fixed;z-index:6;pointer-events:none;color:var(--accent);font-size:1.4rem;animation:up 1.3s ease-out forwards}
@keyframes up{to{transform:translateY(-46px);opacity:0}}
/* bouquet + candles */
#candles{display:flex;gap:min(5vw,22px);align-items:flex-end;padding:0 14px;border-bottom:6px solid var(--pink);border-radius:3px;cursor:pointer}
.candle{width:12px;height:54px;border-radius:3px 3px 0 0;background:repeating-linear-gradient(135deg,#fff 0 6px,var(--c) 6px 12px);position:relative;margin-top:26px}
.flame{position:absolute;left:50%;top:-24px;width:12px;height:20px;margin-left:-6px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(#fff6c8,#ffc94a 60%,#ff9a3c);transform-origin:50% 100%;animation:fl .35s infinite alternate;box-shadow:0 0 14px 4px rgba(255,200,80,.55)}
@keyframes fl{to{transform:scale(.9,1.12) rotate(3deg)}}
.out .flame{animation:none;opacity:0;transform:scale(.2);transition:opacity .5s,transform .5s}
#bq{width:min(62vw,260px);max-height:42vh;object-fit:contain;margin:.6rem 0 .2rem;filter:drop-shadow(0 8px 14px rgba(90,60,90,.3))}
#intro.on #bq{animation:bqin 1.5s ease-out both}
@keyframes bqin{from{transform:scale(.3) translateY(50px);opacity:0}}
/* v5: artwork */
.petals{display:none}
#gc{position:relative;display:block;width:min(80vw,340px);aspect-ratio:1;margin-bottom:-6%}
#gc img{display:block;-webkit-user-drag:none}
#gcat{position:absolute;inset:0;width:100%}
.gboxw{position:absolute;left:29.2%;top:66.6%;width:28.5%;aspect-ratio:292/274;animation:give 1s 1.6s ease-out both}
.gboxw img{position:absolute;left:0;top:0;width:100%}
.gb{clip-path:inset(40% 0 0 0)}
.gt{clip-path:inset(0 0 56% 0);transition:transform .9s ease-in,opacity .9s ease-in}
#giftbtn.open .gt{transform:translate(0,-120%) rotate(-14deg);opacity:0}
#candles{border-bottom:0;gap:min(3vw,12px);padding:0}
.cd{position:relative;width:min(13.5vw,58px);flex:none}
.cb,.cf{display:block;width:100%}
.cf{position:absolute;left:0;top:0;transform-origin:50% 15.6%;animation:fl .4s infinite alternate;filter:drop-shadow(0 0 7px rgba(255,190,70,.9))}
.out .cf{animation:none;opacity:0;transform:scale(.15);transition:opacity .6s,transform .6s}
#rcat img{display:block;width:78px;height:auto}
.bf{transform-origin:30% 55%;animation:flap .3s ease-in-out infinite alternate}
.cuddle .bf{animation-duration:1.3s}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.45)}}
#pw{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 16vh) 24px 24px;background:rgba(243,247,252,.9);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#pw[hidden]{display:none}
#pw label{color:var(--ink)}
/* v7: photo heart */
#hw{--W:min(92vw,400px,calc((100vh - 140px)/1.3));width:var(--W);margin:calc(var(--W)*.23) auto calc(var(--W)*.14)}
#heart{position:relative;width:100%;aspect-ratio:100/90}
#heart>svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 8px 14px rgba(120,100,160,.28))}
#slots{position:absolute;inset:0}
.pol,.wish{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);translate:-50% -50%;rotate:var(--r,0deg);scale:.2;opacity:0;margin:0;transition:opacity .5s var(--d),scale .7s cubic-bezier(.34,1.56,.64,1) var(--d)}
#photos.on .pol,#photos.on .wish{scale:1;opacity:1}
.pol{width:calc(var(--W)*.22);padding:calc(var(--W)*.014) calc(var(--W)*.014) calc(var(--W)*.04);background:linear-gradient(135deg,#cfe6f7,#f9d3de);box-shadow:0 5px 14px rgba(110,100,150,.3);animation:flt 4.5s ease-in-out infinite;animation-delay:var(--d)}
@keyframes flt{50%{transform:translateY(-4px)}}
.pol .ph{border-radius:2px}
.ph:not([style])::before{content:"+";font-size:2rem}
.wish{--x:50;--y:42;--d:.9s;width:calc(var(--W)*.28);height:calc(var(--W)*.33);padding:calc(var(--W)*.014);background:linear-gradient(135deg,#f9c9d8,#bfe0f7);border-radius:10px;box-shadow:0 5px 14px rgba(110,100,150,.3)}
.wish p{margin:0;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;background:#fffaf8;border-radius:7px;padding:4px;font-family:"Great Vibes","GVE","Snell Roundhand",cursive;font-size:clamp(1rem,calc(var(--W)*.062),1.5rem);line-height:1.1;color:var(--accent)}
.cat{position:absolute;height:auto;pointer-events:none;z-index:3;opacity:0;transition:opacity .7s 1.1s;animation:cbob 3.2s ease-in-out infinite}
#photos.on .cat{opacity:1}
.k1{left:52%;top:-24%;width:38%}
.k2{left:-2%;top:80%;width:34%;animation-delay:-1s}
.k3{left:60%;top:70%;width:40%;animation-delay:-2s}
@keyframes cbob{50%{transform:translateY(-6px)}}
#to-photos.show{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-3px)}}
#lb{position:fixed;inset:0;z-index:14;display:flex;align-items:center;justify-content:center;background:rgba(40,50,80,.55);padding:16px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:100%;border:8px solid #fff;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){.pol,.cat,#to-photos.show{animation:none}}

#letter.on #sheet{animation:paperin 1s ease-out}
@keyframes paperin{from{opacity:0;transform:translateY(26px) scale(.96)}}
#paper{position:absolute;inset:11% 12% 12% 12%;overflow-y:auto;cursor:pointer;text-align:left;scrollbar-width:none;color:#2d2219;rotate:.6deg;-webkit-mask-image:linear-gradient(transparent,#000 5%,#000 93%,transparent);mask-image:linear-gradient(transparent,#000 5%,#000 93%,transparent)}
#paper::-webkit-scrollbar{display:none}
#lt{margin:0;font-size:clamp(1.1rem,5vw,1.4rem);line-height:1.45;white-space:pre-wrap}
.sprig{position:absolute;left:-3%;top:-1%;width:30%;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(80,50,20,.3))}
#rib{position:absolute;right:-7%;bottom:-7%;width:25%;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 24%);mask-image:linear-gradient(to bottom,transparent 0,#000 24%);filter:drop-shadow(0 4px 6px rgba(60,10,30,.35))}
#lhint{margin:.7rem 0 0;font-size:1.1rem;color:var(--soft);transition:opacity .5s}
#gc{width:min(96vw,430px)}
.gboxw{left:27.5%;top:66.6%;width:32%}
/* v9: gift cat in the middle, big and clear */
#catwrap{top:0;align-items:center;pointer-events:none}
#giftbtn{pointer-events:auto}
#gc{width:min(96vw,430px,64vh);margin-bottom:0}
/* v10: gift cat lower-middle and clear, bigger letter */
#catwrap{top:0;bottom:0;align-items:center;padding-top:26vh}
#gc{width:min(100vw,480px,64vh);margin-bottom:0}
#g-title,#g-sub{text-shadow:0 1px 0 #fff,0 0 14px rgba(255,255,255,.95)}
#g-sub{color:var(--ink);font-size:1.7rem}
#sheet{width:min(106vw,560px);height:min(76vh,calc(min(106vw,560px)*1.4))}
#paper{inset:9% 10% 10% 10%}
#lt{font-size:clamp(1.2rem,5.4vw,1.55rem)}
/* editor */
#ed{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--bg1);padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
#ed[hidden]{display:none}
.card{max-width:520px;margin:0 auto;font-size:1.2rem}
.card h2{font-size:2.2rem;margin:0 0 .5rem;color:var(--accent)}
.card label{display:block;margin:.9rem 0 .25rem;color:var(--soft)}
.card input,.card textarea{width:100%;padding:.5rem .7rem;font:inherit;font-size:1.2rem;border:2px solid var(--pink);border-radius:10px;background:var(--paper);color:#4a3b3f}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid .ph{border-radius:8px;font-size:1rem}
.row{display:flex;gap:10px;margin-top:1.2rem}
.hint{color:var(--soft);font-size:1rem}
@media (prefers-reduced-motion:reduce){.petals{display:none}#catwrap{animation:none}.eyes ellipse,#bx,#giftbtn:not(.open) #bow{animation:none}.stage,.pol{transition-duration:.01s}}
</style>
</head>

  letter:"To: Dear Little Fish ✨\n\nHey, birthday girl!\n\nI hope this letter finds you smiling, because that’s pretty much how I’d like your whole day to go.\n\nI’m not great at putting certain things into words, but I do know you’re someone worth appreciating. There’s something about your presence, your little ways, and the person you are that makes the world around you feel a little brighter.\n\nI hope this year brings you new adventures, unexpected opportunities, genuine happiness, and memories you’ll never want to forget.\n\nDon’t rush through life. Enjoy the little things, make silly memories, chase whatever makes you happy, and give yourself enough credit along the way.\n\nHere’s to another chapter of being wonderfully you.\n\nAnd however life goes, there’ll always be a permanent cheering hand in your corner: loud, proud, and always on your side.\n\nHappy Birthday, Little Fish! ♡",

var cfg=load(),editing=false,tm=null,timers=[],unlocking=false;
function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||"null");return Object.assign({},DEF,s||{})}catch(e){return Object.assign({},DEF)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){console.warn("Couldn’t save")}}
function digits(v){return v.replace(/[\u09E6-\u09EF]/g,function(c){return c.charCodeAt(0)-2534}).replace(/[\u0660-\u0669]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[\u06F0-\u06F9]/g,function(c){return c.charCodeAt(0)-1776}).replace(/\D/g,"")}
function fill(t){return t.replace(/\{to\}/g,cfg.to).replace(/\{from\}/g,cfg.from)}
function later(fn,ms){timers.push(setTimeout(fn,rm?Math.min(ms,500):ms))}
function show(id){document.querySelectorAll(".stage").forEach(function(s){s.classList.remove("dim");s.classList.toggle("on",s.id===id)})}

(function(){var p=$("petals");for(var i=0;i<20;i++){var d=document.createElement("i"),s=6+Math.random()*10;d.className="petal";d.style.cssText="left:"+Math.random()*100+"%;width:"+s+"px;height:"+s+"px;animation-duration:"+(9+Math.random()*10)+"s;animation-delay:-"+Math.random()*14+"s;--sx:"+(Math.random()*80-40)+"px";p.appendChild(d)}})();

function renderText(){
  $("g-title").textContent="For you, "+cfg.to+".";
  $("i-title").textContent="Happy Birthday, "+cfg.to;
  $("e-title").textContent="Happy birthday, "+cfg.to+" 🐟";
  $("e-wish").textContent=cfg.wish;
  $("e-from").textContent="From "+cfg.from;
}

/* photos */
function slot(i,small){
  var b=document.createElement("button");b.className="ph";b.setAttribute("aria-label","Photo slot "+(i+1));
  if(cfg.photos[i])b.style.backgroundImage="url("+cfg.photos[i]+")";
  b.onclick=function(){if(!cfg.photos[i]||editing||small)pick(i);else openLb(cfg.photos[i])};
  return b;
}
var POS=[[25,27,4],[75,27,-4],[29,60,-3],[71,60,3],[50,81,-2]];
function renderPhotos(){
  var t=$("slots");t.innerHTML="";
  POS.forEach(function(p,i){var f=document.createElement("figure");f.className="pol";f.style.cssText="--x:"+p[0]+";--y:"+p[1]+";--r:"+p[2]+"deg;--d:"+(i*.15+.15)+"s";f.appendChild(slot(i,false));t.appendChild(f)});
  var g=$("e_ph");g.innerHTML="";POS.forEach(function(_,i){g.appendChild(slot(i,true))});
}
function openLb(s){var l=$("lb");l.firstChild.src=s;l.hidden=false}
$("lb").onclick=function(){this.hidden=true};
function pick(i){
  var f=$("file");f.value="";
  f.onchange=function(){var file=f.files[0];if(!file)return;var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){
      var k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      cfg.photos=cfg.photos.slice();cfg.photos[i]=c.toDataURL("image/jpeg",.82);save();renderPhotos()};im.src=r.result};
    r.readAsDataURL(file)};
  f.click();

/* flower images: the supplied watercolor flowers, bloomed in rings, then burned away from the middle */
var FL=FIMG.map(function(u){var i=new Image();i.src=u;return i});
function bloom(){
  var intro=$("intro"),bl=$("bloom");
  if(rm){intro.classList.add("on");bl.classList.remove("on");startCat();return}
  var cv=$("cv"),x=cv.getContext("2d"),d=Math.min(window.devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
  cv.width=w*d;cv.height=h*d;
  var R=Math.hypot(w,h)/2*1.1,K=12,step=R/K,els=[],NZ=[],k,i;
  for(i=0;i<90;i++)NZ.push(Math.random()-.5);
  for(k=0;k<K;k++){
    var r=step*(k+.4),sz=step*2.3+k*2.5,n=Math.max(5,Math.round(6.283*r/(sz*.55)));
    for(i=0;i<n;i++)els.push({a:i/n*6.283+k*.6,r:r+(Math.random()-.5)*step*.3,sz:sz*(.85+Math.random()*.3),im:FL[(i*3+k)%FL.length],rot:Math.random()*6.283,t0:k*.42+i/n*.6});
  }
  var Tb=K*.42+1.4,Tburn=3.4,started=false,T0=performance.now();
  function ease(p){return 1+2.7*Math.pow(p-1,3)+1.7*Math.pow(p-1,2)}
  function poly(b,t){for(var j=0;j<=90;j++){var a=j/90*6.283,rr=Math.max(0,b*(1+.1*Math.sin(a*5+t*2)+.06*Math.sin(a*11-t*3)+.04*Math.sin(a*23+t*5))+NZ[j%90]*16);
    if(j)x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);else x.moveTo(rr,0)}x.closePath()}
  function fb(){bl.classList.remove("on");intro.classList.add("on");startCat()}
  (function frame(now){try{
    var t=(now-T0)/1000;
    x.setTransform(d,0,0,d,0,0);x.globalCompositeOperation="source-over";x.globalAlpha=1;x.clearRect(0,0,w,h);
    x.save();x.translate(w/2,h/2);x.rotate(Math.min(t,Tb)*.08);
    for(var j=0;j<els.length;j++){
      var e=els[j],p=Math.max(0,Math.min(1,(t-e.t0)/.8));if(!p||!e.im.naturalWidth)continue;
      var q=ease(p)*e.sz;x.save();x.globalAlpha=Math.min(1,p*2);
      x.translate(Math.cos(e.a)*e.r,Math.sin(e.a)*e.r);x.rotate(e.rot+p*.5);
      x.drawImage(e.im,-q/2,-q/2*e.im.naturalHeight/e.im.naturalWidth,q,q*e.im.naturalHeight/e.im.naturalWidth);x.restore();
    }
    x.restore();
    if(t>Tb){
      if(!started){started=true;intro.classList.add("on");startCat()}
      var u=Math.min(1,(t-Tb)/Tburn),b=u*(R+70),hh=Math.max(0,b-48);
      x.save();x.translate(w/2,h/2);
      x.globalCompositeOperation="source-atop";
      var g=x.createRadialGradient(0,0,hh,0,0,b+1);g.addColorStop(0,"#1a0b05");g.addColorStop(.55,"#5a2a12");g.addColorStop(.88,"#ff8a2a");g.addColorStop(1,"#ffd45c");
      x.beginPath();poly(b,t);poly(hh,t);x.fillStyle=g;x.fill("evenodd");
      x.globalCompositeOperation="destination-out";x.beginPath();poly(hh,t);x.fill();
      x.globalCompositeOperation="source-over";
      for(var s=0;s<34;s++){var aa=Math.random()*6.283,rr=b-Math.random()*40,sr=1+Math.random()*2.6;
        x.fillStyle="rgba(255,"+(150+Math.random()*80|0)+",60,"+(.5+Math.random()*.5)+")";
        x.beginPath();x.arc(Math.cos(aa)*rr,Math.sin(aa)*rr-Math.random()*26,sr,0,6.283);x.fill()}
      x.restore();
      if(u>=1){bl.classList.remove("on");return}
    }
    requestAnimationFrame(frame);
  }catch(err){fb()}})(T0);
}

/* letter */
function typeLetter(){
  var txt=fill(cfg.letter),i=0,el=$("lt"),paper=$("paper"),btn=$("to-end"),hint=$("lhint"),fin=false;
  el.textContent="";btn.classList.remove("show");hint.style.opacity=1;clearTimeout(tm);paper.scrollTop=0;
  function done(){fin=true;clearTimeout(tm);el.textContent=txt;hint.style.opacity=0;btn.classList.add("show")}
  function step(){
    if(fin)return;i++;el.textContent=txt.slice(0,i);paper.scrollTop=paper.scrollHeight;
    if(i>=txt.length){done();return}
    var c=txt.charAt(i-1),d=44;
    if(c==="\n")d=360;else if(".!?".indexOf(c)>-1)d=330;else if(c===","||c===":")d=150;
    tm=setTimeout(step,d);
  }
  paper.onclick=done;
  if(rm){done();return}
  tm=setTimeout(step,900);
}

/* running cat */
var rc=$("rcat"),rs=$("rsvg"),on=false,C={x:-120,y:300,tx:0,ty:0,st:"run",t:0,h:0,dir:1,last:0};
function plan(){
  var r=Math.random();
  if(r<.5){C.st="run";C.tx=Math.random()*(innerWidth-110);C.ty=50+Math.random()*(innerHeight-170)}
  else if(r<.75){C.st="jump";C.t=0}
  else{C.st="cuddle";C.t=0;C.h=0}
  rs.classList.toggle("running",C.st!=="cuddle");rs.classList.toggle("cuddle",C.st==="cuddle");
}
function heart(){var s=document.createElement("span");s.className="heart";s.textContent="✨";s.style.left=(C.x+(C.dir>0?60:30))+"px";s.style.top=(C.y-6)+"px";document.body.appendChild(s);setTimeout(function(){s.remove()},1400)}
function tick(now){
  if(!on)return;
  var dt=Math.min(.05,(now-C.last)/1000),jy=0,mx=innerWidth-104,my=innerHeight-90;C.last=now;
  if(C.st==="run"){
    var dx=C.tx-C.x,dy=C.ty-C.y,dd=Math.hypot(dx,dy);
    if(dd<8)plan();else{C.x+=dx/dd*90*dt;C.y+=dy/dd*90*dt;if(Math.abs(dx)>4)C.dir=dx>0?1:-1;jy=Math.sin(now/240)*10}
  }else if(C.st==="jump"){
    C.t+=dt;jy=-Math.sin(Math.PI*Math.min(C.t/.75,1))*90;C.x+=C.dir*110*dt;
    if(C.x<0||C.x>mx){C.dir*=-1;C.x=Math.max(0,Math.min(mx,C.x))}
    if(C.t>.75)plan();
  }else{C.t+=dt;C.h+=dt;if(C.h>.6){C.h=0;heart()}if(C.t>3)plan()}
  C.y=Math.max(30,Math.min(my,C.y));
  rc.style.transform="translate("+C.x+"px,"+(C.y+jy)+"px)";rs.style.transform="scaleX("+(-C.dir)+")";
  requestAnimationFrame(tick);
}
function startCat(){if(rm||on)return;on=true;rc.hidden=false;C.x=-110;C.y=innerHeight*.6;plan();C.last=performance.now();requestAnimationFrame(tick)}
function stopCat(){on=false;rc.hidden=true}

/* flow */
function start(){
  timers.forEach(clearTimeout);timers=[];clearInterval(tm);stopCat();unlocking=false;
  $("giftbtn").classList.remove("open");$("catwrap").classList.remove("leave");

(function(){var c=$("candles");for(var i=0;i<5;i++){var d=document.createElement("div");d.className="cd";d.innerHTML='<img class="cb" alt="" src="'+CB+'"><img class="cf" alt="" src="'+CF+'">';c.appendChild(d)}})();
function blow(){var c=$("candles");if(c.classList.contains("out"))return;c.classList.add("out");$("i-sub").textContent="Make a wish… ✨";later(function(){$("to-photos").classList.add("show")},1200)}
$("candles").onclick=blow;$("candles").onkeydown=function(e){if(e.key==="Enter"||e.key===" ")blow()};
$("to-photos").onclick=function(){show("photos")};
$("to-letter").onclick=function(){show("letter");typeLetter()};
$("to-end").onclick=function(){show("end")};
$("replay").onclick=start;
$("pback").onclick=function(){$("pw").hidden=true;$("g-sub").hidden=false};

/* editor */
function openEd(){editing=true;$("ed").hidden=false;$("e_to").value=cfg.to;$("e_from").value=cfg.from;$("e_letter").value=cfg.letter;$("e_wish").value=cfg.wish;renderPhotos()}
function closeEd(){editing=false;$("ed").hidden=true}
function route(){if(location.hash==="#edit")openEd();else closeEd()}
$("e_save").onclick=function(){cfg.to=$("e_to").value.trim()||DEF.to;cfg.from=$("e_from").value.trim()||DEF.from;cfg.letter=$("e_letter").value||DEF.letter;cfg.wish=$("e_wish").value.trim()||DEF.wish;save();location.hash="";closeEd();start()};
$("e_reset").onclick=function(){var b=this;if(b.dataset.s!=="1"){b.dataset.s="1";b.textContent="Tap again to reset";return}b.dataset.s="";b.textContent="Reset";{try{localStorage.removeItem(KEY)}catch(e){}cfg=Object.assign({},DEF);openEd();renderText()}};
addEventListener("hashchange",route);

$("gt").src=$("gb").src;start();route();
})();
